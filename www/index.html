<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3340A0">
<meta name="color-scheme" content="light dark">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="local-store.js"></script>
<title>Family Cashbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — header + scrollable tab bar, one working view at a time, floating "Add entry" for family members */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --sunk:#EDEFF4; --ink:#1A1D2E; --ink2:#4A5068; --muted:#737a93; --line:#E0E3EB;
  --accent:#3340A0; --accent-ink:#FFFFFF; --accent-soft:#E7E9F7; --marigold:#C98410;
  --good:#1D7A4C; --good-soft:#E2F3EA; --warn:#9A6512; --warn-soft:#FBF0DC; --bad:#B8322A; --bad-soft:#FBE6E4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121A; --surface:#191C27; --sunk:#141620; --ink:#ECEEF5; --ink2:#B6BBD0; --muted:#8a90aa; --line:#2A2E3E;
  --accent:#8F9AF2; --accent-ink:#10121A; --accent-soft:#242848; --marigold:#F0B04A;
  --good:#58C993; --good-soft:#15291F; --warn:#E6B656; --warn-soft:#2B2413; --bad:#F2786D; --bad-soft:#2E1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121A; --surface:#191C27; --sunk:#141620; --ink:#ECEEF5; --ink2:#B6BBD0; --muted:#8a90aa; --line:#2A2E3E;
  --accent:#8F9AF2; --accent-ink:#10121A; --accent-soft:#242848; --marigold:#F0B04A;
  --good:#58C993; --good-soft:#15291F; --warn:#E6B656; --warn-soft:#2B2413; --bad:#F2786D; --bad-soft:#2E1715; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;max-width:1360px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
.brand .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12.5px;flex:none;max-width:40%;overflow:hidden;white-space:nowrap}
.brand h1{white-space:nowrap}
.syncchip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:500 12px var(--body);padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.syncchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.syncchip[data-s="synced"]::before{background:var(--good)}
.syncchip[data-s="syncing"]::before{background:var(--accent)}
.syncchip[data-s="error"]::before,.syncchip[data-s="needs-tap"]::before{background:var(--bad)}
.syncchip[data-s="offline"]::before{background:var(--warn)}
@media (max-width:560px){.who{display:none}}
@media (max-width:560px){.brand{flex-direction:column;align-items:flex-start;gap:0}.brand h1{font-size:20px}.brand .sub{max-width:100%}}
.who img{width:26px;height:26px;border-radius:50%}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1360px;margin:0 auto;padding-inline:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;border:0;background:none;color:var(--ink2);font:500 14px var(--body);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:-.005em;text-wrap:balance}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.section{display:grid;gap:12px;margin-top:22px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.kpi{padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;white-space:nowrap}
.kpi .l{color:var(--ink2);font-size:12.5px}
.kpi .s{color:var(--muted);font-size:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpi .v{font-size:21px}}

.chart{position:relative;padding:12px 8px 4px}
.chart svg{display:block;width:100%;height:260px;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgb(0 0 0 / .12);min-width:160px;z-index:3}
.tip b{font-family:var(--display);font-size:16px}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--sunk);font-weight:600;color:var(--ink2);font-size:12.5px}
tr.tot td{font-weight:600;border-top:1px solid var(--line)}
.dim{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.low{background:var(--bad-soft);color:var(--bad)}
.pill.act{background:var(--accent-soft);color:var(--accent)}
.pill.act::before{display:none}

.acc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.acc{padding:12px 14px;display:grid;gap:6px}
.acc .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acc .name{font-weight:600}
.acc .bal{font-family:var(--display);font-weight:700;font-size:20px}
.acc .meta{color:var(--muted);font-size:12px}
.acc svg{width:100%;height:30px;display:block}

.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--ink)}
.alert .ic{flex:none;width:20px;height:20px;border-radius:50%;background:var(--bad);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:12px}
.alert.okay{background:var(--good-soft)} .alert.okay .ic{background:var(--good)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13.5px var(--body);padding:8px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.monthbar{display:flex;align-items:center;gap:8px}
.txfilters{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
@media (max-width:720px){.txfilters{grid-template-columns:1fr 1fr}.txfilters input{grid-column:1/-1}}
.iconbtn{appearance:none;border:0;background:none;color:var(--ink2);width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn[data-act="tx-confirm-plan"],.iconbtn[data-act="tx-confirm-tr"]{color:var(--good)}
.iconbtn[data-act="delentry"]:hover,.iconbtn[data-act="deltr"]:hover,.iconbtn[data-act="tx-skip-plan"]:hover{color:var(--bad)}
.pill.plan{background:var(--accent-soft);color:var(--accent)}
.pill.plan::before{display:none}
.txtable td{vertical-align:middle}
.txtable tfoot td{background:var(--sunk);white-space:normal}
@media (max-width:640px){
  .txtable thead{display:none}
  .txtable tbody tr[data-status]{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px;border-bottom:1px solid var(--line)}
  .txtable tbody tr[data-status][hidden]{display:none}
  .txtable tbody td{border:0;padding:0;white-space:normal}
  .txtable tbody td:nth-child(1){grid-column:1;font-size:12px;color:var(--muted)}
  .txtable tbody td:nth-child(2){grid-column:1}
  .txtable tbody td:nth-child(3){grid-column:1;font-size:12.5px;color:var(--ink2)}
  .txtable tbody td:nth-child(4){grid-column:2;grid-row:1}
  .txtable tbody td:nth-child(5){grid-column:2;grid-row:2 / span 2;align-self:center}
  .txtable tbody td:nth-child(6){grid-column:1 / -1}
  .txtable tfoot tr{display:block;padding:10px 12px}.txtable tfoot td{display:block;border:0;padding:0;text-align:left}
}
.loanwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1260px){.loanwrap{grid-template-columns:minmax(0,1.85fr) minmax(320px,1fr)}.loandetail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 130px);overflow:auto}}
.loantable td{vertical-align:middle}
.loanrow{cursor:pointer}
.loanrow:hover td{background:var(--sunk)}
.loanrow.sel td{background:var(--accent-soft)}
.loanrow.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
input.loanin{width:112px;text-align:right}
.loantable th,.loantable td{padding-inline:10px}
.loantable td{white-space:nowrap}
.loantable td:first-child{white-space:normal;min-width:140px}
@media (max-width:640px){
  .loantable thead{display:none}
  .loantable tr.loanrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:12px;border-bottom:1px solid var(--line)}
  .loantable tr.loanrow td{border:0;padding:0;text-align:left;background:none!important;box-shadow:none!important}
  .loantable tr.loanrow td:first-child,.loantable tr.loanrow td:nth-child(6){grid-column:1/-1}
  .loantable tr.loanrow.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .loantable tr.loanrow td:nth-child(n+2):nth-child(-n+5)::before{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .loantable tr.loanrow td:nth-child(2)::before{content:"Outstanding"}
  .loantable tr.loanrow td:nth-child(3)::before{content:"Scheduled payment"}
  .loantable tr.loanrow td:nth-child(4)::before{content:"Interest % a year"}
  .loantable tr.loanrow td:nth-child(5)::before{content:"Ends"}
  .loantable input.loanin{width:100%!important;text-align:left}
}
input.loanin:placeholder-shown{border-style:dashed}
.lkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px) and (max-width:1259px){.lkgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lk{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-width:0}
.lk .l{font-size:12px;color:var(--ink2)}
.lk .v{font-family:var(--display);font-weight:700;font-size:18px}
.lk .s{font-size:11.5px;color:var(--muted)}
input.balin{width:108px;text-align:right}
@media (max-width:560px){
  .trtable thead{display:none}
  .trtable tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .trtable tr.grp{display:block;padding:6px 12px}
  .trtable td{border:0;padding:0;white-space:normal}
  .trtable td:nth-child(3){grid-column:1/2;text-align:left}
  .trtable td:nth-child(4){grid-column:1/-1}
  .trtable td:nth-child(4) .row{justify-content:flex-start!important;flex-wrap:wrap!important}
  .trtable td:nth-child(2)::before{content:"Plan ";color:var(--muted);font-size:12px}
}
input.balin:placeholder-shown{border-style:dashed}
.monthbar .lbl{font-family:var(--display);font-weight:700;font-size:18px;min-width:108px;text-align:center}

input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--ink2)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}

/* Plan grid */
.plan{max-height:70vh;overflow:auto}
.plan table{width:max-content;min-width:100%}
.plan th,.plan td{padding:0;border-right:1px solid var(--line)}
.plan th{position:sticky;top:0;z-index:2;padding:8px 8px}
.plan .stick{position:sticky;left:0;z-index:1;background:var(--surface);min-width:210px;max-width:240px;padding:6px 10px;white-space:normal}
.plan th.stick{z-index:3;background:var(--sunk)}
.plan tr.grp td{padding:6px 10px}
.plan tr.grp td.stick{background:var(--sunk)}
.plan input.cell{width:92px;border:0;border-radius:0;background:transparent;text-align:right;padding:7px 8px}
.plan input.cell:focus{background:var(--accent-soft);outline:none}
.plan td.cur{background:color-mix(in srgb,var(--marigold) 9%,transparent)}
.plan th.cur{color:var(--marigold)}
.plan .catname{display:flex;justify-content:space-between;gap:6px;align-items:center}
.plan .catname button{flex:none}
.plan .acct{display:block;color:var(--muted);font-size:11.5px}
.plan tr.tot td{padding:7px 8px;text-align:right;background:var(--sunk)}
.plan tr.tot td.stick{text-align:left;background:var(--sunk)}

/* Modal sheet */
.scrim{position:fixed;inset:0;background:rgb(10 12 20 / .45);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:88vh;overflow:auto;padding:18px;display:grid;gap:14px;border:1px solid var(--line)}
.sheet .form{grid-template-columns:repeat(2,minmax(0,1fr))}
.sheet .full{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink2);padding:7px 14px;font:500 13px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 8px 24px rgb(20 24 60 / .25);padding:12px 18px;font-size:14.5px;border-radius:999px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);margin-bottom:4px}
.person{display:inline-flex;align-items:center;gap:6px}
.person img{width:18px;height:18px;border-radius:50%}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style>

</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><h1>Family Cashbook</h1><span class="sub" id="sub">Loading family accounts…</span></div>
    <div class="row" style="flex-wrap:nowrap;gap:10px;min-width:0"><button class="syncchip" id="sync" data-tab="setup" hidden></button><div class="who" id="who"></div></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" data-tab="month" aria-selected="false">Month</button>
    <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
    <button role="tab" data-tab="loans" aria-selected="false">Loans &amp; EMIs</button>
    <button role="tab" data-tab="business" aria-selected="false">Businesses</button>
    <button role="tab" data-tab="transactions" aria-selected="false">Transactions</button>
    <button role="tab" data-tab="setup" aria-selected="false">Accounts &amp; setup</button>
  </nav>
</header>

<main class="wrap" id="view">
  <div class="panel empty" style="margin-top:24px"><b>Loading your family's accounts</b>Balances, the monthly plan and everyone's entries appear here once the shared ledger connects.</div>
</main>

<button class="btn primary fab" id="fab" hidden>+ Add entry</button>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const GROUPS = ['Income','Loans & EMIs','Household','Education','Savings & investments','Insurance & health','Property & construction','Business','Other'];
const FAMILY_GROUPS = GROUPS.filter(g => g !== 'Income' && g !== 'Business');
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addM = (m, n) => { let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12 + 12) % 12 + 1; return y + '-' + String(mo).padStart(2, '0'); };
const range = (a, b) => { const o = []; if (!a || !b) return o; for (let m = a; m <= b && o.length < 240; m = addM(m, 1)) o.push(m); return o; };
const mlabel = m => MN[+m.slice(5) - 1] + ' ' + m.slice(0, 4);
const mshort = m => MN[+m.slice(5) - 1] + " '" + m.slice(2, 4);
const inr = n => (n < 0 ? '−' : '') + '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN');
const short = n => { const a = Math.abs(n), s = n < 0 ? '−' : ''; if (a >= 1e7) return s + '₹' + (a / 1e7).toFixed(2).replace(/\.?0+$/, '') + ' Cr'; if (a >= 1e5) return s + '₹' + (a / 1e5).toFixed(1).replace(/\.0$/, '') + ' L'; if (a >= 1e3) return s + '₹' + (a / 1e3).toFixed(0) + 'k'; return s + '₹' + Math.round(a); };
const num = v => { const n = parseFloat(String(v).replace(/[₹,\s]/g, '')); return isFinite(n) ? n : 0; };
const todayM = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); })();
const todayD = new Date().toISOString().slice(0, 10);

const S = { settings: null, accounts: {}, categories: {}, transfers: {}, entries: {}, businesses: {}, balances: {}, ready: new Set() };
let db = null, user = null, uid = null, canWrite = true, tab = 'overview', selMonth = null, planFrom = null, trFrom = null;
let pending = false, C = null, isAdmin = true;
const closedThrough = () => S.settings?.closedThrough || '';
const locked = m => !!closedThrough() && m <= closedThrough();
const firstOpen = () => closedThrough() ? addM(closedThrough(), 1) : (S.settings?.start || todayM);

try { const t = location.hash.slice(1); if (t === 'transfers') tab = 'transactions'; else if (['overview','month','plan','loans','business','transactions','setup'].includes(t)) tab = t; } catch (e) {}

// ---------- engine ----------
const accList = () => Object.values(S.accounts).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name));
const bizList = () => Object.values(S.businesses).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name));
const bizName = id => S.businesses[id]?.name || 'Unnamed business';
const isBiz = c => c.group === 'Business' && !!c.business;
function sectionOf(c) {
  if (isBiz(c)) { const i = bizList().findIndex(b => b.id === c.business); return { key: 'b:' + c.business, label: bizName(c.business) + ' · business', rank: 100 + (i < 0 ? 99 : i) }; }
  if (c.type === 'income') return { key: 'Income', label: 'Family income', rank: 0 };
  const g = FAMILY_GROUPS.indexOf(c.group); return { key: c.group || 'Other', label: c.group || 'Other', rank: 1 + (g < 0 ? FAMILY_GROUPS.length : g) };
}
const catList = () => Object.values(S.categories).sort((a, b) => sectionOf(a).rank - sectionOf(b).rank || (a.type === 'income' ? 0 : 1) - (b.type === 'income' ? 0 : 1) || (a.order ?? 999) - (b.order ?? 999) || String(a.name).localeCompare(b.name));
const catLabel = c => (isBiz(c) ? bizName(c.business) + ' · ' : '') + c.name;
const accName = id => S.accounts[id]?.name || 'Unassigned';

function compute() {
  const st = S.settings || {};
  const ms = range(st.start, st.end);
  const accs = accList();
  const act = {};
  for (const e of Object.values(S.entries)) { ((act[e.categoryId] ??= {})[e.month] ??= []).push(e); }
  const rows = {}, bal = {}, total = {}, below = {}, flow = {};
  // Transfers: a logged actual (real date, accounts, amount) replaces the planned one, possibly in another month.
  const trByMonth = {};
  for (const [pm, d] of Object.entries(S.transfers)) for (const t of (d.items || [])) {
    const a = t.actual, em = a?.date ? a.date.slice(0, 7) : pm;
    if (!a && locked(pm)) continue; // closed months keep confirmed transfers only
    (trByMonth[em] ??= []).push({ from: a?.from || t.from, to: a?.to || t.to, amount: +(a ? a.amount : t.amount) || 0, act: !!a });
  }
  accs.forEach(a => { rows[a.id] = {}; bal[a.id] = +a.opening || 0; });
  for (const m of ms) {
    const r = {}; let conf = 0; accs.forEach(a => r[a.id] = { begin: bal[a.id], rec: 0, pay: 0, tin: 0, tout: 0 });
    for (const c of Object.values(S.categories)) {
      const apply = (acc, amt) => { if (!r[acc]) return; if (c.type === 'income') r[acc].rec += amt; else r[acc].pay += amt; };
      const list = act[c.id]?.[m];
      if (list && list.length) { conf += list.length; list.forEach(e => apply(e.accountId || c.account, +e.amount || 0)); }
      else if (!locked(m)) { const v = +(c.amounts?.[m]) || 0; if (v) apply(c.account, v); }
    }
    for (const t of (trByMonth[m] || [])) { if (t.act) conf++; if (r[t.from]) r[t.from].tout += t.amount; if (r[t.to]) r[t.to].tin += t.amount; }
    let tot = 0, inc = 0, exp = 0, diff = 0, counted = 0; const b = [];
    const bank = S.balances[m]?.values || {};
    for (const a of accs) {
      const x = r[a.id]; x.calc = x.begin + x.rec + x.tin - x.pay - x.tout; x.end = x.calc;
      const v = bank[a.id];
      if (v !== null && v !== undefined && v !== '' && isFinite(+v)) { x.actual = +v; x.diff = x.actual - x.calc; x.end = x.actual; diff += x.diff; counted++; }
      bal[a.id] = x.end; tot += x.end; inc += x.rec; exp += x.pay; if (x.end < (+a.min || 0)) b.push(a.id); rows[a.id][m] = x;
    }
    total[m] = tot; below[m] = b; flow[m] = { inc, exp, diff, counted, confirmed: conf };
  }
  const cur = ms.length ? (todayM < ms[0] ? ms[0] : todayM > ms[ms.length - 1] ? ms[ms.length - 1] : todayM) : todayM;
  // Once the current month is closed, "now" moves to the first open month.
  const curOpen = locked(cur) && ms.includes(firstOpen()) ? firstOpen() : cur;
  return { ms, accs, rows, total, below, flow, act, cur: curOpen };
}
const planVal = (c, m) => +(c.amounts?.[m]) || 0;
const eff = (c, m) => actualVal(c, m) ?? (locked(m) ? 0 : planVal(c, m));
const actualVal = (c, m) => { const l = C.act[c.id]?.[m]; return l && l.length ? l.reduce((s, e) => s + (+e.amount || 0), 0) : null; };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

}
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function status(end, min) { return end < min ? `<span class="pill low">Below min</span>` : `<span class="pill ok">OK</span>`; }

function spark(accId) {
  const vals = C.ms.map(m => C.rows[accId]?.[m]?.end ?? 0);
  if (!vals.length) return '';
  const mn = Math.min(0, ...vals), mx = Math.max(...vals, 1), w = 200, h = 30;
  const pts = vals.map((v, i) => `${(i / Math.max(1, vals.length - 1) * w).toFixed(1)},${(h - 2 - (v - mn) / (mx - mn) * (h - 4)).toFixed(1)}`).join(' ');
  const min = +S.accounts[accId]?.min || 0, my = (h - 2 - (min - mn) / (mx - mn) * (h - 4)).toFixed(1);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="${my}" y2="${my}" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity=".6"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

  // alerts: per account, months below min from current month on

function drawChart(el) {
  const ms = C.ms; if (!ms.length) return;
  const W = Math.max(300, el.clientWidth - 16), H = 260, L = 58, R = 14, T = 16, B = 28;
  const vals = ms.map(m => C.total[m]);
  const minReq = C.accs.reduce((s, a) => s + (+a.min || 0), 0);
  const lo = Math.min(0, ...vals), hi = Math.max(...vals, minReq) * 1.08 || 1;
  const step = (() => { const raw = (hi - lo) / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(s => s >= raw); })();
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const x = i => L + i / Math.max(1, ms.length - 1) * (W - L - R);
  const y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let v = y0; v <= y1 + 1; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`;
  const every = ms.length > 24 ? 4 : ms.length > 12 ? 3 : 1;
  ms.forEach((m, i) => { if (i % every === 0) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${mshort(m)}</text>`; });
  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area = line + `L${x(ms.length - 1)},${y(Math.max(0, y0))}L${x(0)},${y(Math.max(0, y0))}Z`;
  const ci = ms.indexOf(C.cur);
  const dots = ms.map((m, i) => C.below[m].length ? `<circle cx="${x(i)}" cy="${y(vals[i])}" r="4.5" fill="var(--bad)" stroke="var(--surface)" stroke-width="2"/>` : '').join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total cash by month">
    ${g}
    <line x1="${L}" x2="${W - R}" y1="${y(minReq)}" y2="${y(minReq)}" stroke="var(--ink2)" stroke-dasharray="5 4" opacity=".7"/>
    <text x="${W - R}" y="${y(minReq) - 6}" text-anchor="end">Combined minimum ${short(minReq)}</text>
    ${ci >= 0 ? `<line x1="${x(ci)}" x2="${x(ci)}" y1="${T}" y2="${H - B}" stroke="var(--marigold)" stroke-width="1.5"/><text x="${x(ci) + 5}" y="${T + 10}" style="fill:var(--marigold)">Now</text>` : ''}
    <path d="${area}" fill="var(--accent)" opacity=".10"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <line id="xh" y1="${T}" y2="${H - B}" stroke="var(--ink2)" stroke-width="1" opacity="0"/>
    <circle id="xd" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/>
  </svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = svg.querySelector('#xh'), xd = svg.querySelector('#xd');
  const move = ev => {
    const bb = svg.getBoundingClientRect(), px = (ev.clientX - bb.left) / bb.width * W;
    const i = Math.max(0, Math.min(ms.length - 1, Math.round((px - L) / (W - L - R) * (ms.length - 1))));
    const m = ms[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', .5);
    xd.setAttribute('cx', x(i)); xd.setAttribute('cy', y(vals[i])); xd.setAttribute('opacity', 1);
    const f = C.flow[m];
    tip.innerHTML = `<div class="dim">${mlabel(m)}</div><b>${inr(vals[i])}</b><div class="dim">In ${short(f.inc)} · Out ${short(f.exp)}</div>${C.below[m].length ? `<div style="color:var(--bad);margin-top:4px">Below min: ${C.below[m].map(id => esc(accName(id))).join(', ')}</div>` : ''}`;
    tip.hidden = false;
    const tx = x(i) / W * bb.width; tip.style.left = Math.min(bb.width - tip.offsetWidth, Math.max(0, tx + 12 - (tx > bb.width * .6 ? tip.offsetWidth + 24 : 0))) + 'px'; tip.style.top = '8px';
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('opacity', 0); xd.setAttribute('opacity', 0); });
}

async function fillPeople() {
  const spans = [...document.querySelectorAll('.person[data-uid]')]; if (!spans.length) return;
  const ids = [...new Set(spans.map(s => s.dataset.uid).filter(Boolean))];
  let ps = {}; if (user && ids.length) { try { ps = await user.profiles(ids); } catch (e) {} }
  spans.forEach(s => { const p = ps[s.dataset.uid]; s.textContent = ''; if (p?.avatarUrl) { const i = document.createElement('img'); i.src = p.avatarUrl; i.alt = ''; s.append(i); } s.append(document.createTextNode('Added by ' + ((p?.isMe ? 'you' : p?.name) || 'a family member'))); });
}

function plan() {
  const all = C.ms; if (!planFrom || !all.includes(planFrom)) planFrom = C.cur;
  const ms = all.filter(m => m >= addM(planFrom, 0)).slice(0, 12);
  const cats = catList();
  let body = '', grp = null;
  const tots = {}; ms.forEach(m => tots[m] = { inc: 0, exp: 0 });
  cats.forEach(c => {
    const sec = sectionOf(c);
    if (sec.key !== grp) { grp = sec.key; body += `<tr class="grp"><td class="stick">${esc(sec.label)}</td>${ms.map(() => '<td></td>').join('')}</tr>`; }
    body += `<tr><td class="stick"><div class="catname"><span>${esc(c.name)}<span class="acct">${isBiz(c) ? (c.type === 'income' ? 'Money in · ' : 'Money out · ') : ''}${esc(accName(c.account))}</span></span>${canWrite ? `<button class="btn small ghost" data-act="editcat" data-cat="${c.id}" aria-label="Edit ${esc(c.name)}">Edit</button>` : ''}</div></td>
      ${ms.map(m => { const v = planVal(c, m); tots[m][c.type === 'income' ? 'inc' : 'exp'] += v; const a = actualVal(c, m); return `<td class="${m === C.cur ? 'cur' : ''}"><input class="cell" id="p-${c.id}-${m}" data-cat="${c.id}" data-m="${m}" value="${v ? v.toLocaleString('en-IN') : ''}" inputmode="decimal" ${canWrite && !locked(m) ? '' : 'readonly'} title="${a != null ? 'Actual logged: ' + inr(a) : ''}" aria-label="${esc(c.name)} ${mlabel(m)}"></td>`; }).join('')}</tr>`;
  });
  const i = all.indexOf(planFrom);
  $('#view').innerHTML = `
  <div class="section"><div class="section-head">
    <div><h2>Monthly plan</h2><div class="hint">Type a figure and press Tab to save. Use Edit on a row to rename it, move it to another account, or fill a fixed amount across many months at once.</div></div>
    <div class="row"><button class="btn small" data-act="pprev" ${i <= 0 ? 'disabled' : ''}>‹ Earlier</button><span class="dim">${mshort(ms[0])} – ${mshort(ms[ms.length - 1])}</span><button class="btn small" data-act="pnext" ${i + 12 >= all.length ? 'disabled' : ''}>Later ›</button>${canWrite ? `<button class="btn small primary" data-act="newcat">+ Category</button>` : ''}</div>
  </div>
  <div class="panel plan"><table><thead><tr><th class="stick">Category</th>${ms.map(m => `<th class="n ${m === C.cur ? 'cur' : ''}" ${locked(m) ? 'title="Closed month"' : ''}>${locked(m) ? '🔒 ' : ''}${mshort(m)}</th>`).join('')}</tr></thead>
  <tbody>${body}
    <tr class="tot"><td class="stick">Planned in</td>${ms.map(m => `<td>${short(tots[m].inc)}</td>`).join('')}</tr>
    <tr class="tot"><td class="stick">Planned out</td>${ms.map(m => `<td>${short(tots[m].exp)}</td>`).join('')}</tr>
    <tr class="tot"><td class="stick">Total cash, month end</td>${ms.map(m => `<td><b>${short(C.total[m])}</b></td>`).join('')}</tr>
  </tbody></table></div></div>`;
}

const tenureTxt = n => { if (n == null) return '—'; const y = Math.floor(n / 12), mo = n % 12; return (y ? y + (y > 1 ? ' yrs' : ' yr') : '') + (y && mo ? ' ' : '') + (mo || !y ? mo + (mo === 1 ? ' mo' : ' mos') : ''); };

function loanInfo(c) {
  const L = c.loan || {}, cur = C.cur;
  const planned = C.ms.filter(m => planVal(c, m) > 0);
  const lastPlanM = planned[planned.length - 1] || null;
  const lastPay = lastPlanM ? planVal(c, lastPlanM) : 0;
  const pay = m => (lastPlanM && m <= lastPlanM) ? eff(c, m) : lastPay; // after the plan ends, assume the last EMI continues
  const sched = eff(c, cur) || C.ms.filter(m => m >= cur).map(m => planVal(c, m)).find(v => v > 0) || lastPay || 0;
  const kind = L.kind === 'interest' ? 'interest' : 'emi';
  const has = L.outstanding !== null && L.outstanding !== undefined && L.outstanding !== '' && +L.outstanding > 0;
  const rate = +L.rate || 0, r = rate / 1200;
  const o = { c, L, has, kind, rate, sched, lastPlanM, lastPay, asOf: L.asOf || '', rows: [], now: null, end: null, months: null, totInt: null, stuck: false };
  if (!has) return o;
  const asOfM = (L.asOf || cur).slice(0, 7);
  const start = addM(asOfM, 1) > cur ? addM(asOfM, 1) : cur;
  let B = +L.outstanding;
  if (kind === 'emi') for (let m = addM(asOfM, 1); m < start; m = addM(m, 1)) B = Math.max(0, B + B * r - pay(m));
  o.now = B; o.start = start;
  if (kind === 'interest') {
    const mat = L.maturity || '';
    const n = mat && mat >= start ? range(start, mat).length : null;
    const i = B * r;
    if (n) for (let k = 0, m = start; k < n; k++, m = addM(m, 1)) o.rows.push({ m, pay: i + (k === n - 1 ? B : 0), int: i, prin: k === n - 1 ? B : 0, bal: k === n - 1 ? 0 : B });
    o.months = n; o.end = n ? mat : null; o.totInt = n ? i * n : null; o.monthlyInt = i;
    return o;
  }
  let tot = 0;
  for (let m = start, k = 0; B > 0.5 && k < 600; m = addM(m, 1), k++) {
    const i = B * r, p0 = pay(m);
    if (p0 <= 0 && (!lastPlanM || m > lastPlanM)) { o.stuck = true; break; }
    const p = Math.min(p0, B + i);
    B = B + i - p; tot += i;
    o.rows.push({ m, pay: p, int: i, prin: p - i, bal: B });
    if (k >= 24 && p <= i) { o.stuck = true; break; }
  }
  if (!o.stuck && B <= 0.5 && o.rows.length) { o.end = o.rows[o.rows.length - 1].m; o.months = o.rows.length; o.totInt = tot; }
  else o.stuck = true;
  return o;
}

let selLoan = null, showSched = false;
function loans() {
  const cur = C.cur, horizonEnd = C.ms[C.ms.length - 1];
  const list = catList().filter(c => c.group === 'Loans & EMIs').map(loanInfo).sort((a, b) => (b.now ?? -1) - (a.now ?? -1) || b.sched - a.sched);
  if (selLoan && !list.find(x => x.c.id === selLoan)) selLoan = null;
  const withBal = list.filter(x => x.has);
  const totOut = withBal.reduce((s, x) => s + x.now, 0);
  const avgRate = totOut ? withBal.reduce((s, x) => s + x.now * x.rate, 0) / totOut : 0;
  const emiNow = list.reduce((s, x) => s + eff(x.c, cur), 0);
  const ends = withBal.filter(x => x.end).map(x => x.end).sort();
  const missing = list.length - withBal.length;
  const intLeft = withBal.reduce((s, x) => s + (x.totInt || 0), 0);
  const inp = (x, f, v, extra) => `<input class="loanin" id="ln-${f}-${x.c.id}" data-loan-f="${f}" data-cat="${x.c.id}" inputmode="decimal" value="${v}" placeholder="${f === 'rate' ? '% p.a.' : 'Enter'}" ${canWrite ? '' : 'readonly'} ${extra || ''}>`;
  $('#view').innerHTML = `
  <div class="kpis">
    <div class="panel kpi"><span class="l">Total outstanding</span><span class="v">${withBal.length ? short(totOut) : '—'}</span><span class="s">${withBal.length ? inr(totOut) : 'Enter balances below'}${missing && withBal.length ? ` · ${missing} without a balance` : ''}</span></div>
    <div class="panel kpi"><span class="l">EMIs &amp; interest in ${mlabel(cur)}</span><span class="v">${short(emiNow)}</span><span class="s">${C.flow[cur]?.inc ? Math.round(emiNow / C.flow[cur].inc * 100) + '% of this month\'s income' : inr(emiNow)}</span></div>
    <div class="panel kpi"><span class="l">Average interest rate</span><span class="v">${totOut && avgRate ? avgRate.toFixed(2) + '%' : '—'}</span><span class="s">Weighted by balance · interest left ${intLeft ? short(intLeft) : '—'}</span></div>
    <div class="panel kpi"><span class="l">Debt-free by</span><span class="v">${ends.length && !missing && !withBal.some(x => x.stuck && x.kind === 'emi') ? mlabel(ends[ends.length - 1]) : '—'}</span><span class="s">${missing ? 'Needs every loan\'s balance' : withBal.some(x => x.stuck) ? 'Some loans have no end date' : 'When the last loan is repaid'}</span></div>
  </div>
  <div class="section"><div class="section-head"><div><h2>Loans and commitments</h2><div class="hint">Type the outstanding principal and interest rate from your latest statement; the balance date updates to today. Tap a loan for its tenure, end date and repayment schedule. Scheduled payments come from the Plan tab.</div></div>${canWrite ? '<button class="btn small primary" data-act="newloan">+ Loan</button>' : ''}</div>
  <div class="loanwrap">
    <div class="panel scroll"><table class="loantable"><thead><tr><th>Loan / commitment</th><th class="n">Outstanding principal</th><th class="n">EMI / payment</th><th class="n">Rate % p.a.</th><th>Ends</th><th>Actions</th></tr></thead><tbody>
    ${list.map(x => `<tr class="loanrow ${x.c.id === selLoan ? 'sel' : ''}" data-loan="${x.c.id}" tabindex="0">
      <td><b style="font-weight:600">${esc(x.c.name)}</b><div class="dim" style="font-size:12px">${esc(accName(x.c.account))}${x.kind === 'interest' ? ' · interest only' : ''}</div></td>
      <td class="n">${inp(x, 'outstanding', x.has ? (+x.L.outstanding).toLocaleString('en-IN') : '')}<div class="dim" style="font-size:11.5px;margin-top:2px">${x.asOf ? 'as of ' + esc(x.asOf) : 'from your statement'}</div></td>
      <td class="n">${x.sched ? inr(x.sched) : '<span class="dim">—</span>'}</td>
      <td class="n">${inp(x, 'rate', x.L.rate ? x.L.rate : '', 'style="width:66px"')}</td>
      <td>${!x.has ? '<span class="dim">—</span>' : x.end ? mlabel(x.end) : `<span class="pill low">${x.kind === 'interest' ? 'Set maturity' : 'No end'}</span>`}</td>
      <td><div class="row" style="flex-wrap:nowrap"><button class="btn small" data-act="loansched" data-cat="${x.c.id}">Schedule</button>${canWrite ? `<button class="btn small ghost" data-act="loanedit" data-cat="${x.c.id}" aria-label="Edit ${esc(x.c.name)}">✎</button>` : ''}</div></td></tr>`).join('') || `<tr><td colspan="6" class="dim">No loans yet. Add one with “+ Loan”, or move a Plan row into the “Loans &amp; EMIs” group.</td></tr>`}
    </tbody></table></div>
    <div class="panel pad loandetail" id="loandetail">${selLoan ? loanDetail(list.find(x => x.c.id === selLoan), horizonEnd) : '<div class="empty" style="padding:20px 8px"><b>Pick a loan</b>Tap any loan to see its outstanding balance today, remaining tenure, end date and repayment schedule.</div>'}</div>
  </div></div>`;
  if (selLoan && window.innerWidth < 1260 && loans._scroll) { loans._scroll = false; $('#loandetail').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

function loanDetail(x, horizonEnd) {
  const c = x.c;
  const head = `<div class="section-head" style="margin-bottom:10px"><div><h2>${esc(c.name)}</h2><div class="hint">${esc(accName(c.account))} · ${x.kind === 'interest' ? 'Interest-only loan' : 'EMI loan'}</div></div>${canWrite ? `<button class="btn small" data-act="loanedit" data-cat="${c.id}">Edit loan</button>` : ''}</div>`;
  if (!x.has) return head + `<div class="empty" style="padding:16px 8px"><b>Add the loan details</b>Enter the outstanding principal and interest rate from your latest loan statement to see tenure, end date and schedule.${canWrite ? `<div style="margin-top:12px"><button class="btn primary" data-act="loanedit" data-cat="${c.id}">Enter loan details</button></div>` : ''}</div>`;
  const cards = [
    ['Outstanding today', inr(x.now), x.asOf ? `${inr(+x.L.outstanding)} on ${esc(x.asOf)}` : ''],
    ['Interest rate', x.rate ? x.rate + '% p.a.' : 'Not entered', x.kind === 'interest' ? `Monthly interest ${inr(x.monthlyInt || 0)}` : ''],
    ['Scheduled payment', inr(x.sched), x.kind === 'interest' ? 'Should cover the interest' : 'Monthly EMI from the plan'],
    ['Remaining tenure', x.months ? tenureTxt(x.months) : '—', x.months ? x.months + ' payments' : ''],
    ['Ends', x.end ? mlabel(x.end) : '—', x.end && x.end > horizonEnd ? 'After your plan ends' : ''],
    ['Interest still to pay', x.totInt != null ? inr(x.totInt) : '—', x.totInt != null && x.now ? 'on ' + inr(x.now) + ' principal' : ''],
  ].map(([l, v, s]) => `<div class="lk"><span class="l">${l}</span><span class="v">${v}</span>${s ? `<span class="s">${s}</span>` : ''}</div>`).join('');
  let warn = '';
  if (x.kind === 'emi' && x.stuck) warn = `<div class="alert"><span class="ic">!</span><div>At ${inr(x.lastPay || x.sched)} a month this loan is never repaid${x.rate ? `; the payment barely covers the ${x.rate}% interest` : ''}. Check the rate and balance, or raise the EMI in the Plan tab.</div></div>`;
  else if (x.kind === 'interest' && !x.end) warn = `<div class="alert" style="background:var(--warn-soft)"><span class="ic" style="background:var(--warn)">?</span><div>Set a maturity month to see when the principal of ${inr(x.now)} falls due.</div></div>`;
  else if (x.kind === 'emi' && x.end && x.lastPlanM && x.end > x.lastPlanM) warn = `<div class="alert" style="background:var(--warn-soft)"><span class="ic" style="background:var(--warn)">!</span><div>Your plan has EMIs only until ${mlabel(x.lastPlanM)}, but this loan runs to ${mlabel(x.end)}.${x.lastPlanM < horizonEnd && canWrite ? ` <button class="btn small" data-act="loanfit" data-cat="${c.id}">Add EMIs to the plan up to ${mlabel(x.end < horizonEnd ? x.end : horizonEnd)}</button>` : ' The rest falls after your plan ends; extend it in Accounts &amp; setup.'}</div></div>`;
  else if (x.kind === 'emi' && x.end && x.lastPlanM && x.end < x.lastPlanM) warn = `<div class="alert" style="background:var(--warn-soft)"><span class="ic" style="background:var(--warn)">!</span><div>This loan is repaid in ${mlabel(x.end)}, but the plan still has EMIs until ${mlabel(x.lastPlanM)}.${canWrite ? ` <button class="btn small" data-act="loanfit" data-cat="${c.id}">Stop the plan's EMIs after ${mlabel(x.end)}</button>` : ''}</div></div>`;
  const rows = x.rows;
  const chart = rows.length > 1 ? (() => {
    const W = 520, H = 120, L = 6, R = 6, T = 10, B = 20, mx = Math.max(x.now, ...rows.map(r => r.bal)) || 1;
    const px = i => L + i / (rows.length - 1) * (W - L - R), py = v => T + (1 - v / mx) * (H - T - B);
    const pts = rows.map((r, i) => `${px(i).toFixed(1)},${py(r.bal).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Outstanding balance over time"><polygon points="${L},${py(0)} ${pts} ${px(rows.length - 1)},${py(0)}" fill="var(--accent)" opacity=".1"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/><line x1="${L}" x2="${W - R}" y1="${py(0)}" y2="${py(0)}" stroke="var(--line)"/><text x="${L}" y="${H - 5}" style="fill:var(--muted);font:10px var(--body)">${mshort(rows[0].m)}</text><text x="${W - R}" y="${H - 5}" text-anchor="end" style="fill:var(--muted);font:10px var(--body)">${mshort(rows[rows.length - 1].m)}</text></svg>`;
  })() : '';
  const shown = showSched ? rows : rows.slice(0, 6);
  const table = rows.length ? `<div class="section-head" style="margin-top:14px"><h3>Repayment schedule</h3>${rows.length > 6 ? `<button class="btn small ghost" data-act="loanschedtoggle">${showSched ? 'Show less' : `Show all ${rows.length} months`}</button>` : ''}</div>
    <div class="scroll" style="max-height:${showSched ? '420px' : 'none'};overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px"><table><thead><tr><th>Month</th><th class="n">Payment</th><th class="n">Interest</th><th class="n">Principal</th><th class="n">Balance</th></tr></thead><tbody>
    ${shown.map(r => `<tr><td>${mlabel(r.m)}</td><td class="n">${inr(r.pay)}</td><td class="n dim">${inr(r.int)}</td><td class="n">${inr(r.prin)}</td><td class="n">${inr(r.bal)}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Uses the plan's payments (and logged actuals) while the plan runs, then assumes the last EMI continues. Estimates only; your lender's statement is the final word.</p>` : '';
  return head + `<div class="lkgrid">${cards}</div>${warn ? `<div style="margin-top:12px">${warn}</div>` : ''}${chart ? `<div style="margin-top:12px">${chart}</div>` : ''}${table}`;
}

  openModal(`<h2>${esc(c.name)}</h2>

function bizPerf(id) {
  const cats = catList().filter(c => isBiz(c) && c.business === id);
  const per = C.ms.map(m => { let i = 0, o = 0; cats.forEach(c => { const v = eff(c, m); if (c.type === 'income') i += v; else o += v; }); return { m, i, o, n: i - o }; });
  return { cats, per };
}

function bizBars(per) {
  const W = 640, H = 120, L = 4, R = 4, T = 8, B = 20;
  const mx = Math.max(1, ...per.map(p => Math.abs(p.n)));
  const hasNeg = per.some(p => p.n < 0);
  const zero = hasNeg ? T + (H - T - B) / 2 : H - B;
  const span = hasNeg ? (H - T - B) / 2 : H - T - B;
  const bw = (W - L - R) / per.length;
  const every = per.length > 24 ? 4 : per.length > 12 ? 3 : 1;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Net result by month">
    <line x1="${L}" x2="${W - R}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>
    ${per.map((p, k) => { const h = Math.abs(p.n) / mx * span; const x = L + k * bw + 1; const y = p.n >= 0 ? zero - h : zero; return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${Math.max(p.n ? 1 : 0, h).toFixed(1)}" rx="2" fill="${p.n < 0 ? 'var(--bad)' : 'var(--good)'}" opacity="${p.m === C.cur ? 1 : .75}"><title>${mlabel(p.m)}: in ${inr(p.i)}, out ${inr(p.o)}, net ${inr(p.n)}</title></rect>`; }).join('')}
    ${per.map((p, k) => k % every === 0 ? `<text x="${(L + k * bw + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" style="fill:var(--muted);font:10px var(--body)">${mshort(p.m)}</text>` : '').join('')}
  </svg>`;
}

// ---------- account types and minimum-balance guard ----------
const accKind = a => a?.kind || (/\bNRE\b/i.test(a?.name || '') ? 'NRE' : /\bNRO\b/i.test(a?.name || '') ? 'NRO' : 'Savings');
// Indian NRE accounts can only be funded from abroad or from another NRE account.
const canTransfer = (from, to) => from.id !== to.id && (accKind(to) !== 'NRE' || accKind(from) === 'NRE');
function minBalancePlan() {
  const ms = C.ms.filter(m => m >= C.cur && !locked(m));
  if (!ms.length) return [];
  const used = {}; // already suggested out of each account
  // Money an account can give from month m on without dropping below its own minimum afterwards.
  const spareFrom = (s, m) => Math.max(0, Math.floor(Math.min(...ms.filter(x => x >= m).map(x => C.rows[s.id][x].end - (+s.min || 0))) / 1000) * 1000 - (used[s.id] || 0));
  const out = [];
  for (const a of C.accs) {
    const min = +a.min || 0, bad = ms.filter(m => C.rows[a.id][m].end < min);
    if (!bad.length) continue;
    const first = bad[0], after = ms.filter(m => m >= first);
    const worst = Math.max(...after.map(m => min - C.rows[a.id][m].end));
    const need = Math.ceil(worst / 1000) * 1000;
    const srcs = C.accs.filter(s => canTransfer(s, a)).map(s => ({ s, sp: spareFrom(s, first) })).filter(x => x.sp > 0).sort((x, y) => y.sp - x.sp);
    let left = need; const moves = [];
    for (const { s, sp } of srcs) { if (left <= 0) break; const amt = Math.min(left, sp); used[s.id] = (used[s.id] || 0) + amt; left -= amt; moves.push({ from: s, to: a, amount: amt, month: first }); }
    out.push({ acc: a, first, months: bad.length, worst, need, moves, short: left });
  }
  return out;
}
function minBalanceHtml(list, compact) {
  if (!list.length) return `<div class="alert okay"><span class="ic">✓</span><div>Every account stays above its minimum balance for the rest of the plan.</div></div>`;
  return list.map(x => `<div class="alert" style="background:var(--warn-soft)"><span class="ic" style="background:var(--warn)">!</span><div>
    <b>${esc(x.acc.name)}</b> falls below its ${inr(+x.acc.min || 0)} minimum in <b>${mlabel(x.first)}</b>${x.months > 1 ? ` and ${x.months - 1} more month${x.months > 2 ? 's' : ''}` : ''}, short by up to ${inr(x.worst)}.
    ${x.moves.length ? `<div style="margin-top:6px">Suggested: ${x.moves.map(mv => `move <b>${inr(mv.amount)}</b> from <b>${esc(mv.from.name)}</b> in ${mlabel(mv.month)}${canWrite ? ` <button class="btn small" data-act="plan-suggest" data-from="${mv.from.id}" data-to="${mv.to.id}" data-amt="${mv.amount}" data-m="${mv.month}">Plan this transfer</button>` : ''}`).join('; ')}.</div>` : ''}
    ${x.short > 0 ? `<div class="dim" style="margin-top:4px;font-size:12.5px">${x.moves.length ? `That still leaves ${inr(x.short)} uncovered. ` : ''}${accKind(x.acc) === 'NRE' ? 'An NRE account can only be topped up from another NRE account or money sent from abroad, and no NRE account has enough to spare.' : 'No other account has enough to spare without going below its own minimum.'}${compact ? '' : ' Consider reducing planned spending from this account or moving an expense to another account.'}</div>` : ''}
  </div></div>`).join('');
}
let prevBelowSig = null;
function watchMinimums() {
  const list = minBalancePlan();
  const sig = new Set(list.map(x => x.acc.id + ':' + x.first));
  if (prevBelowSig) { const fresh = list.filter(x => !prevBelowSig.has(x.acc.id + ':' + x.first)); if (fresh.length) toast(`Heads up: ${fresh[0].acc.name} goes below its minimum in ${mlabel(fresh[0].first)}. See the suggested transfer on Overview or Transactions.`); }
  prevBelowSig = sig;
  return list;
}

function txRows(m) {

  }
  return rows.sort((x, y) => String(y.date).localeCompare(String(x.date)) || (x.status === y.status ? 0 : x.status === 'Completed' ? -1 : 1) || String(x.desc).localeCompare(y.desc));
}

function applyTxFilter() {

// ---------- events ----------
const armed = new Map();
function confirmTwice(btn, key) {
  if (armed.get(key)) { armed.delete(key); return true; }
  armed.set(key, true); const old = btn.textContent; btn.textContent = 'Tap again to confirm';
  setTimeout(() => { armed.delete(key); if (btn.isConnected) btn.textContent = old; }, 3500);
  return false;
}

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-tab],[data-act]');
  if (!t) { const row = ev.target.closest('[data-loan]'); if (row && !ev.target.closest('input,button,select')) { selLoan = row.dataset.loan; showSched = false; loans._scroll = true; render(); } return; }
  if (t.dataset.tab) { tab = t.dataset.tab; try { history.replaceState(null, '', '#' + tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  const a = t.dataset.act;
  if (a === 'scrim') { if (ev.target === t) closeModal(); return; }
  if (a === 'close') return closeModal();
  if (a === 'mprev') { selMonth = addM(selMonth, -1); return render(); }
  if (a === 'mnext') { selMonth = addM(selMonth, 1); return render(); }
  if (a === 'mnow') { selMonth = C.cur; return render(); }
  if (a === 'loansched') { selLoan = t.dataset.cat; showSched = true; loans._scroll = true; return render(); }
  if (a === 'loanschedtoggle') { showSched = !showSched; return render(); }
  if (a === 'loanedit') return loanModal(t.dataset.cat);
  if (a === 'newloan') return catModal(null, null, 'Loans & EMIs');
  if (a === 'lkind') { $('#lm-kind').value = t.dataset.k; document.querySelectorAll('[data-act=lkind]').forEach(b => b.setAttribute('aria-pressed', b === t)); $('#lm-mat-wrap').hidden = t.dataset.k !== 'interest'; return; }
  if (a === 'saveloan') {
    const id = t.dataset.cat, raw = $('#lm-out').value.trim(), rr = $('#lm-rate').value.trim();
    const outstanding = raw === '' ? null : num(raw), rate = rr === '' ? null : num(rr);
    if (rate !== null && (rate < 0 || rate > 60)) return toast('Enter the yearly interest rate as a percentage, e.g. 8.5.');
    const loan = { kind: $('#lm-kind').value, outstanding, rate, asOf: $('#lm-asof').value || todayD, maturity: $('#lm-mat').value || '' };
    t.disabled = true;
    if (await write(() => db.doc('categories/' + id).update({ loan }), 'Loan details saved')) { selLoan = id; closeModal(); render(); } else t.disabled = false;
    return;
  }
  if (a === 'loanfit') {
    const c = S.categories[t.dataset.cat]; if (!c) return;
    const x = loanInfo(c), he = C.ms[C.ms.length - 1];
    if (!x.end || !x.lastPlanM) return;
    const amounts = { ...(c.amounts || {}) };
    const finalPay = x.rows.length ? x.rows[x.rows.length - 1].pay : x.lastPay;
    if (x.end > x.lastPlanM) {
      for (const m of range(addM(x.lastPlanM, 1), x.end < he ? x.end : he)) if (!locked(m)) amounts[m] = Math.round(m === x.end ? finalPay : x.lastPay);
    } else {
      if (!locked(x.end)) amounts[x.end] = Math.round(finalPay);
      for (const m of Object.keys(amounts)) if (m > x.end && !locked(m)) delete amounts[m];
    }
    const { id, ...body } = c; body.amounts = amounts;
    return write(() => db.doc('categories/' + c.id).set(body), 'Plan updated to match the loan');
  }
  if (a === 'reopen') {
    if (!confirmTwice(t, 'ro' + t.dataset.m)) return;
    const prev = addM(t.dataset.m, -1);
    return write(() => db.doc('settings/main').update({ closedThrough: S.settings.start && prev >= S.settings.start ? prev : '' }), mlabel(t.dataset.m) + ' reopened. Fix what you need, then re-enter a bank balance to close it again.');
  }
  if (a === 'gomonth') { selMonth = t.dataset.m; tab = 'month'; render(); window.scrollTo(0, 0); return; }
  if (a === 'pprev') { planFrom = addM(planFrom, -12); if (planFrom < C.ms[0]) planFrom = C.ms[0]; return render(); }
  if (a === 'pnext') { planFrom = addM(planFrom, 12); return render(); }
  if (a === 'log') return entryModal(t.dataset.cat);
  if (a === 'etype') { entryType = t.dataset.t; return entryModal(); }
  if (a === 'saveentry') {
    const amt = num($('#e-amt').value), date = $('#e-date').value; let cat = $('#e-cat').value;
    if (!cat) return toast('Pick a category first.');
    if (!amt) return toast('Enter an amount above zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Pick a date for the entry.');
    if (locked(date.slice(0, 7))) return toast(mlabel(date.slice(0, 7)) + ' is closed. Pick a date from ' + mlabel(firstOpen()) + ' on.');
    const note = $('#e-note').value.trim(), editId = t.dataset.id;
    if (cat === '__misc') {
      const inc = entryType === 'income'; cat = inc ? 'c-misc-in' : 'c-misc-out';
      if (!note) return toast('Add a short description for this one-off transaction.');
      if (!S.categories[cat]) { t.disabled = true; if (!await write(() => db.doc('categories/' + cat).set({ name: inc ? 'Other income' : 'Miscellaneous', type: inc ? 'income' : 'expense', group: inc ? 'Income' : 'Other', account: $('#e-acc').value, order: 998, amounts: {} }))) { t.disabled = false; return; } }
    }
    const old = editId ? S.entries[editId] : null;
    const body = { date, month: date.slice(0, 7), categoryId: cat, accountId: $('#e-acc').value, amount: amt, note, by: old?.by ?? (uid || ''), createdAt: old?.createdAt || new Date().toISOString(), ...(old ? { editedAt: new Date().toISOString() } : {}) };
    t.disabled = true;
    if (await write(() => editId ? db.doc('entries/' + editId).set(body) : db.collection('entries').add(body), editId ? 'Transaction updated' : 'Saved')) closeModal(); else t.disabled = false;
    return;
  }
  if (a === 'delentry') { if (!confirmTwice(t, 'e' + t.dataset.id)) return; return write(() => db.doc('entries/' + t.dataset.id).delete(), 'Entry deleted'); }
  if (a === 'editcat') return catModal(t.dataset.cat);
  if (a === 'drive-connect' || a === 'drive-sync') {
    const D = window.__cashbookLocal?.drive; if (!D) return;
    try { await D.connect(); toast(a === 'drive-connect' ? 'Google Drive connected. Your ledger is in sync.' : 'Synced with Google Drive'); } catch (e) { toast(e?.message || 'Could not reach Google Drive.'); }
    return render();
  }
  if (a === 'drive-off') {
    if (!confirmTwice(t, 'driveoff')) return;
    await window.__cashbookLocal.drive.disconnect(); toast('This device is disconnected. Your ledger stays here and in Drive.'); return render();
  }
  if (a === 'pwa-install') { const ok = await window.__cashbookLocal.pwa.install(); if (ok) toast('Installed. Open Family Cashbook from its icon, even offline.'); return render(); }
  if (a === 'pwa-protect') { await window.__cashbookLocal.pwa.protect(); toast(window.__cashbookLocal.pwa.persisted ? 'Storage protected' : 'The browser declined for now. Installing the app usually allows it.'); return render(); }
  if (a === 'backup') { try { await window.__cashbookLocal.exportData(); } catch (e) { if (!/cancel/i.test(e?.message || '')) toast('Could not save the backup: ' + (e?.message || e)); } return; }
  if (a === 'newcat') return catModal(null, t.dataset.biz);
  if (a === 'newbiz') return bizModal(null);
  if (a === 'editbiz') return bizModal(t.dataset.id);
  if (a === 'savebiz') {
    const name = $('#b-name').value.trim(); if (!name) return toast('Give the business a name.');
    const id = t.dataset.id || newId('b'); t.disabled = true;
    const ok = await write(() => t.dataset.id ? db.doc('businesses/' + id).update({ name }) : db.doc('businesses/' + id).set({ name, order: bizList().length }), 'Business saved');
    if (ok) { closeModal(); tab = 'business'; render(); } else t.disabled = false;
    return;
  }
  if (a === 'delbiz') { if (!confirmTwice(t, 'b' + t.dataset.id)) return; if (await write(() => db.doc('businesses/' + t.dataset.id).delete(), 'Business deleted')) closeModal(); return; }
  if (a === 'startledger') {
    const start = todayM, end = addM(todayM, 23); t.disabled = true;
    const ok = await write(async () => { await db.doc('settings/main').set({ start, end, currency: 'INR' }); if (!Object.keys(S.accounts).length) await db.doc('accounts/' + newId('a')).set({ name: 'Main savings', opening: 0, min: 0, notes: '', order: 0 }); }, 'Ledger started. Add your accounts next.');
    if (ok) { tab = 'setup'; schedule(); } else t.disabled = false;
    return;
  }
  if (a === 'savecat') {
    const id = t.dataset.id || newId('c'); const old = S.categories[id];
    const name = $('#c-name').value.trim(); if (!name) return toast('Give the row a name.');
    const type = $('#c-type').value, owner = $('#c-owner').value;
    const group = owner ? 'Business' : type === 'income' ? 'Income' : $('#c-group').value;
    const body = { name, type, group, business: owner || null, account: $('#c-acc').value, order: old?.order ?? 999, amounts: { ...(old?.amounts || {}) } };
    const fill = $('#c-fill').value.trim();
    if (fill !== '') {
      const v = num(fill), every = +$('#c-every').value, from = $('#c-from').value, to = $('#c-to').value;
      if (to < from) return toast('“Until” must be after “From”.');
      range(from, to).forEach((m, i) => { if (locked(m)) return; if (i % every === 0 && v) body.amounts[m] = v; else delete body.amounts[m]; });
    }
    t.disabled = true;
    if (await write(() => db.doc('categories/' + id).set(body), 'Plan row saved')) closeModal(); else t.disabled = false;
    return;
  }
  if (a === 'delcat') { if (!confirmTwice(t, 'c' + t.dataset.id)) return; if (await write(() => db.doc('categories/' + t.dataset.id).delete(), 'Row deleted')) closeModal(); return; }
  if (a === 'addtr') {
    const from = $('#t-from').value, to = $('#t-to').value, amount = num($('#t-amt').value), ref = $('#t-ref').value.trim(), m0 = $('#t-m').value, until = $('#t-until').value || m0;
    if (from === to) return toast('Pick two different accounts.');
    if (!amount) return toast('Enter an amount above zero.');
    if (until < m0) return toast('“Repeat until” must be after the first month.');
    if (locked(m0)) return toast(mlabel(m0) + ' is closed.');
    t.disabled = true;
    let ok = true;
    for (const m of range(m0, until)) {
      const items = [...(S.transfers[m]?.items || []), { id: newId('t'), from, to, amount, ref }];
      ok = await write(() => db.doc('transfers/' + m).set({ month: m, items })); if (!ok) break;
    }
    t.disabled = false; if (ok) { toast('Transfer added'); $('#t-amt').value = ''; }
    return;
  }
  if (a === 'tx-new') { txModal.k = 'expense'; return txModal('expense'); }
  if (a === 'txk') return txModal(t.dataset.k);
  if (a === 'tx-export') { try { await exportTx(); } catch (e) { if (!/cancel/i.test(e?.message || '')) toast('Could not export: ' + (e?.message || e)); } return; }
  if (a === 'tx-edit-entry') { const e = S.entries[t.dataset.id]; if (e) entryModal(e.categoryId, { entryId: t.dataset.id }); return; }
  if (a === 'tx-confirm-plan') {
    const c = S.categories[t.dataset.cat], m = selMonth; if (!c || locked(m)) return;
    const body = { date: m === todayM ? todayD : m + '-01', month: m, categoryId: c.id, accountId: c.account, amount: planVal(c, m), note: '', by: uid || '', createdAt: new Date().toISOString() };
    return write(() => db.collection('entries').add(body), c.name + ' confirmed');
  }
  if (a === 'tx-skip-plan') {
    if (!confirmTwice(t, 'skip' + t.dataset.cat)) return;
    return write(() => db.doc('categories/' + t.dataset.cat).update({ amounts: { [t.dataset.m]: 0 } }), 'Removed from ' + mlabel(t.dataset.m) + '\'s plan');
  }
  if (a === 'tx-confirm-tr') {
    const m = t.dataset.m, id = t.dataset.id, tr = (S.transfers[m]?.items || []).find(x => x.id === id); if (!tr) return;
    const items = S.transfers[m].items.map(x => x.id === id ? { ...x, actual: { from: x.from, to: x.to, amount: +x.amount || 0, date: m === todayM ? todayD : m + '-01', note: '', by: uid || '', at: new Date().toISOString() } } : x);
    return saveTransfers(m, items, 'Transfer confirmed');
  }
  if (a === 'tx-save-tr') {
    const from = $('#x-from').value, to = $('#x-to').value, amount = num($('#x-amt').value), date = $('#x-date').value, ref = $('#x-ref').value.trim(), done = $('#x-status').value === 'done', until = $('#x-until').value;
    if (from === to) return toast('Pick two different accounts.');
    if (!canTransfer(S.accounts[from], S.accounts[to])) return toast(S.accounts[to].name + ' is an NRE account: it can only receive money from another NRE account.');
    if (!amount) return toast('Enter an amount above zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Pick a date.');
    const m0 = date.slice(0, 7); if (locked(m0)) return toast(mlabel(m0) + ' is closed.');
    const months = until && until > m0 ? range(m0, until) : [m0];
    t.disabled = true; let ok = true;
    for (const [i, m] of months.entries()) {
      const item = { id: newId('t'), from, to, amount, ref };
      if (done && i === 0) item.actual = { from, to, amount, date, note: '', by: uid || '', at: new Date().toISOString() };
      ok = await saveTransfers(m, [...(S.transfers[m]?.items || []), item]); if (!ok) break;
    }
    if (ok) { toast(done ? 'Transfer saved' : 'Transfer planned'); closeModal(); } else t.disabled = false;
    return;
  }
  if (a === 'plan-suggest') {
    const m = t.dataset.m, from = t.dataset.from, to = t.dataset.to, amount = +t.dataset.amt;
    t.disabled = true;
    return saveTransfers(m, [...(S.transfers[m]?.items || []), { id: newId('t'), from, to, amount, ref: 'Keep ' + S.accounts[to].name + ' above minimum' }], 'Transfer planned for ' + mlabel(m));
  }
  if (a === 'trlog') return trModal(t.dataset.m, t.dataset.id, 'actual');
  if (a === 'trplan') return trModal(t.dataset.m, t.dataset.id, 'plan');
  if (a === 'savetra' || a === 'cleartra') {
    const m = t.dataset.m, id = t.dataset.id;
    let actual = null;
    if (a === 'savetra') {
      const from = $('#ta-from').value, to = $('#ta-to').value, amount = num($('#ta-amt').value), date = $('#ta-date').value;
      if (from === to) return toast('Pick two different accounts.');
      if (!canTransfer(S.accounts[from], S.accounts[to])) return toast(S.accounts[to].name + ' is an NRE account: it can only receive money from another NRE account.');
      if (!amount) return toast('Enter the amount you actually moved.');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Pick the date of the transfer.');
      if (locked(date.slice(0, 7))) return toast(mlabel(date.slice(0, 7)) + ' is closed. Pick a date from ' + mlabel(firstOpen()) + ' on.');
      actual = { from, to, amount, date, note: $('#ta-note').value.trim(), by: uid || '', at: new Date().toISOString() };
    } else if (!confirmTwice(t, 'ta' + id)) return;
    const items = (S.transfers[m]?.items || []).map(x => { if (x.id !== id) return x; const y = { ...x }; if (actual) y.actual = actual; else delete y.actual; return y; });
    t.disabled = true;
    if (await saveTransfers(m, items, actual ? 'Actual transfer saved' : 'Actual removed')) closeModal(); else t.disabled = false;
    return;
  }
  if (a === 'savetrplan') {
    const m = t.dataset.m, id = t.dataset.id, nm = $('#tp-m').value;
    const from = $('#tp-from').value, to = $('#tp-to').value, amount = num($('#tp-amt').value), ref = $('#tp-ref').value.trim();
    if (from === to) return toast('Pick two different accounts.');
    if (!canTransfer(S.accounts[from], S.accounts[to])) return toast(S.accounts[to].name + ' is an NRE account: it can only receive money from another NRE account.');
    if (!amount) return toast('Enter an amount above zero.');
    const old = (S.transfers[m]?.items || []).find(x => x.id === id); if (!old) return closeModal();
    const upd = { ...old, from, to, amount, ref };
    t.disabled = true; let ok;
    if (nm === m) ok = await saveTransfers(m, S.transfers[m].items.map(x => x.id === id ? upd : x), 'Plan updated');
    else {
      ok = await saveTransfers(nm, [...(S.transfers[nm]?.items || []), upd]);
      if (ok) ok = await saveTransfers(m, S.transfers[m].items.filter(x => x.id !== id), 'Moved to ' + mlabel(nm));
    }
    if (ok) closeModal(); else t.disabled = false;
    return;
  }
  if (a === 'deltr') {
    if (!confirmTwice(t, 't' + t.dataset.id)) return;
    const m = t.dataset.m; const items = (S.transfers[m]?.items || []).filter(x => x.id !== t.dataset.id);
    return write(() => db.doc('transfers/' + m).set({ month: m, items }), 'Transfer deleted');
  }
  if (a === 'addacc') { const id = newId('a'); return write(() => db.doc('accounts/' + id).set({ name: 'New account', opening: 0, min: 0, notes: '', order: C.accs.length }), 'Account added'); }
  if (a === 'delacc') {
    const used = Object.values(S.categories).some(c => c.account === t.dataset.id);
    if (used) return toast('Move its plan rows to another account first (Plan › Edit).');
    if (!confirmTwice(t, 'a' + t.dataset.id)) return;
    return write(() => db.doc('accounts/' + t.dataset.id).delete(), 'Account removed');
  }
});
$('#fab').addEventListener('click', () => { if (tab === 'transactions') { txModal.k = 'expense'; return txModal('expense'); } entryModal(null); });
document.addEventListener('input', ev => { if (ev.target.id === 'tx-q') { txQ = ev.target.value; applyTxFilter(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').innerHTML) closeModal();
  if (e.key === 'Enter' && e.target.matches?.('[data-loan]')) { selLoan = e.target.dataset.loan; showSched = false; loans._scroll = true; render(); }
});

document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.id === 'restore-file') {
    const f = el.files && el.files[0]; if (!f) return;
    try { await window.__cashbookLocal.importData(await f.text()); toast('Backup restored'); } catch (e) { toast(e?.message || 'Could not read that file.'); }
    el.value = ''; return;
  }
  if (el.id === 'c-owner' || el.id === 'c-type') { $('#c-group-wrap').hidden = !!$('#c-owner').value || $('#c-type').value === 'income'; return; }
  if (el.id === 'e-cat') { const c = S.categories[el.value]; if (c) { $('#e-acc').value = c.account; const p = planVal(c, ($('#e-date').value || todayD).slice(0, 7)); $('#e-amt').value = p ? p.toLocaleString('en-IN') : ''; } return; }
  if (el.dataset.loanF) {
    const c = S.categories[el.dataset.cat]; if (!c) return;
    const f = el.dataset.loanF, raw = el.value.trim(), v = raw === '' ? null : num(raw);
    if (f === 'rate' && v !== null && (v < 0 || v > 60)) { toast('Enter the yearly interest rate as a percentage, e.g. 8.5.'); el.value = c.loan?.rate || ''; return; }
    if ((c.loan?.[f] ?? null) === v) return;
    const patch = f === 'outstanding' ? { outstanding: v, asOf: todayD } : { rate: v };
    await write(() => db.doc('categories/' + c.id).update({ loan: patch }), f === 'outstanding' ? 'Balance saved as of today' : 'Interest rate saved');
    return;
  }
  if (el.id === 'tx-status') { txStatus = el.value; return applyTxFilter(); }
  if (el.id === 'tx-acc') { txAcc = el.value; return applyTxFilter(); }
  if (el.id === 'tr-from') { trFrom = el.value; el.blur(); return render(); }
  if (el.dataset.balAcc) {
    const m = el.dataset.m, acc = el.dataset.balAcc, raw = el.value.trim();
    if (locked(m)) return toast(mlabel(m) + ' is closed.');
    const v = raw === '' ? null : num(raw);
    const cur = S.balances[m]?.values?.[acc];
    if ((cur ?? null) === v) return;
    if (v !== null) el.value = v.toLocaleString('en-IN');
    const ref = db.doc('balances/' + m);
    const ok = await write(() => S.balances[m] ? ref.update({ values: { [acc]: v }, updatedBy: uid || '', updatedAt: new Date().toISOString() }) : ref.set({ month: m, values: { [acc]: v }, updatedBy: uid || '', updatedAt: new Date().toISOString() }), v === null ? 'Bank balance cleared' : 'Bank balance saved');
    if (ok && v !== null) {
      const vals = { ...(S.balances[m]?.values || {}), [acc]: v };
      const all = C.accs.every(a => vals[a.id] !== null && vals[a.id] !== undefined && vals[a.id] !== '' && isFinite(+vals[a.id]));
      if (all && m > closedThrough()) {
        if (await write(() => db.doc('settings/main').update({ closedThrough: m, closedAt: new Date().toISOString(), closedBy: uid || '' }))) toast(mlabel(m) + ' is closed. It and earlier months are now locked.');
      }
    }
    return;
  }
  if (el.classList.contains('cell')) {
    const c = S.categories[el.dataset.cat]; if (!c) return; const v = num(el.value);
    if (v === planVal(c, el.dataset.m)) return;
    el.value = v ? v.toLocaleString('en-IN') : '';
    await write(() => db.doc('categories/' + c.id).update({ amounts: { [el.dataset.m]: v } }));
    return;
  }
  if (el.dataset.acc) {
    const f = el.dataset.f, v = (f === 'opening' || f === 'min') ? num(el.value) : el.value.trim();
    if (f === 'name' && !v) return toast('An account needs a name.');
    await write(() => db.doc('accounts/' + el.dataset.acc).update({ [f]: v }), 'Saved'); return;
  }
  if (el.id === 's-start' || el.id === 's-end') {
    const start = $('#s-start').value, end = $('#s-end').value;
    if (!start || !end || end < start) return toast('The plan must end after it starts.');
    if (range(start, end).length >= 240) return toast('Keep the plan under 20 years.');
    await write(() => db.doc('settings/main').set({ ...S.settings, start, end }), 'Plan horizon updated');
  }
});
window.addEventListener('resize', () => { if (tab === 'overview' && C) drawChart($('#chart')); });

// ---------- boot ----------
(async () => {
  try { db = await window.claude?.use?.('db'); } catch (e) { db = null; }
  try { user = await window.claude?.use?.('user'); } catch (e) { user = null; }
  if (user) {
    try { uid = await user.id(); const w = await user.can('data.write'); canWrite = w !== false; isAdmin = !!(await user.canEdit()); const me = await user.me();
      const who = $('#who'); who.textContent = ''; const img = document.createElement('img'); img.src = me.avatarUrl; img.alt = ''; who.append(img, document.createTextNode(me.name || 'You'));
    } catch (e) {}
  }
  window.addEventListener('cashbook-pwa', () => { if (tab === 'setup' && !$('#modal').innerHTML) schedule(); });
  window.__cashbookLocal?.drive?.onChange(() => { updateSync(); if ((tab === 'setup' || !S.settings) && !$('#modal').innerHTML) schedule(); });
  if (!db) { render(); return; }
  const onErr = e => { if (e?.code !== 'revoked') toast('Lost live updates. Reload the page to reconnect.'); };
  db.doc('settings/main').onSnapshot(s => { S.settings = s.exists ? s.data() : null; S.ready.add('settings'); schedule(); }, onErr);
  for (const col of ['accounts', 'categories', 'entries', 'businesses']) {
    db.collection(col).onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = { ...d.data(), id: d.id }); S[col] = o; S.ready.add(col); schedule(); }, onErr);
  }
  db.collection('transfers').onSnapshot(q => { const o = {}; q.docs.forEach(d => { const x = d.data(); o[x.month || d.id] = x; }); S.transfers = o; schedule(); }, onErr);
  db.collection('balances').onSnapshot(q => { const o = {}; q.docs.forEach(d => { const x = d.data(); o[x.month || d.id] = x; }); S.balances = o; schedule(); }, onErr);
  render();
})();
})();
</script>
