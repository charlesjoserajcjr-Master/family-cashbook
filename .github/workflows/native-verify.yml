name: Native preview verification (no publishing)
on:
  pull_request:
    paths: ['www/**', 'desktop/**', 'scripts/**', 'package*.json', 'tests/**', '.github/workflows/native-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare-web
      - run: node scripts/prepare-preview.mjs
      - run: npx cap add android
      - run: npm run patch-android
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            node tests/android-native.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            test-artifacts/*.png
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare-web
      - run: node scripts/prepare-preview.mjs
      - name: Copy prepared web assets
        shell: pwsh
        run: |
          Copy-Item -LiteralPath www -Destination desktop/www -Recurse
          New-Item -ItemType Directory -Force desktop/build | Out-Null
          Copy-Item -LiteralPath www/icons/icon-512.png -Destination desktop/build/icon.png
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: node tests/electron-native.cjs
      - run: npx electron-builder --win portable --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview
          path: |
            desktop/dist/*.exe
            test-artifacts/*.png
          if-no-files-found: ignore
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare-web
      - run: node scripts/prepare-preview.mjs
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Compile simulator preview without signing
        shell: bash
        run: |
          set -o pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build > ios-build.log 2>&1
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build > ios-build.log 2>&1
          fi
      - name: Install and launch on an iPhone simulator
        shell: bash
        run: |
          mkdir -p test-artifacts
          DEVICE=$(xcrun simctl list devices available -j | node -e "let s='';process.stdin.on('data',x=>s+=x);process.stdin.on('end',()=>{const devices=Object.values(JSON.parse(s).devices).flat();const d=devices.find(d=>d.name.startsWith('iPhone')&&d.isAvailable);if(!d)process.exit(1);process.stdout.write(d.udid);});")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.familycashbook.preview
          sleep 5
          xcrun simctl io "$DEVICE" screenshot test-artifacts/ios-native-launch.png
          ditto -c -k --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app test-artifacts/ios-simulator-preview.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-preview
          path: |
            test-artifacts/
            ios-build.log
          if-no-files-found: ignore
