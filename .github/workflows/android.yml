name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Bundle fonts into the app
        run: npm run prepare-web

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Version number and signing
        run: npm run patch-android

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build with your upload key (test APK + Play Store AAB)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: familycashbook
        run: |
          chmod +x gradlew
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew assembleRelease bundleRelease --no-daemon
          echo "::notice title=SHA-1 for Google sign-in::$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA1:' | sed 's/.*SHA1: //')"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Build test APK without a key (only if no key is set up)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Collect the files
        run: |
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/Family-Cashbook-test-${{ github.run_number }}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/Family-Cashbook-test-${{ github.run_number }}.apk"
          fi
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/Family-Cashbook-${{ github.run_number }}.aab"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: family-cashbook-android-${{ github.run_number }}
          path: out/

      - name: Put the test app on the Releases page (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --target "${{ github.sha }}" \
            --prerelease --title "Test build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "On your Android phone: tap the .apk file below, download it, then open it to install."
